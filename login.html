<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VitalCare | Login e cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="/header.css" />
</head>
<body>
  <div class="auth-page">
    <header class="header">
      <a class="logo" href="/index.html" aria-label="Voltar para a home">
        <img src="/pages/imagens/logo.png" alt="VitalCare" />
      </a>
      <nav class="nav" aria-label="Navegação principal">
        <a class="nav-link" href="/index.html">Home</a>
        <a class="nav-link" href="/pages/intrucoes/instrucoes (1).html">Instruções</a>
        <a class="nav-link" href="/pages/produtos/produto.html">Produto</a>
        <a class="nav-link" href="/pages/equipe/equipe (1).html">Equipe</a>
        <a class="nav-link" href="/pages/referencias/referencias (1).html">Referências</a>
        <a class="nav-link" href="/pages/jogo/jogo (2).html">Jogo</a>
        <a class="nav-link is-active nav-login" href="/login.html">Login</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Alternar tema">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="none" stroke="#1F2A44" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="vc-burger" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main class="auth-main">
      <section class="auth-copy" aria-label="Apresentação">
        <span class="eyebrow">Cuidado que acompanha</span>
        <h1>Mais tranquilidade para cuidar de quem importa.</h1>
        <p>Entre na sua conta para acompanhar a rotina, os alertas e as informações do VitalCare.</p>
      </section>

      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="auth-panel-top">
          <p class="auth-kicker" id="form-mode">ACESSAR SUA CONTA</p>
          <h2 id="auth-title">Bem-vindo de volta<span>.</span></h2>
          <p class="auth-switch-text"><span id="switch-label">Ainda não tem uma conta?</span> <button class="text-button" id="switch-mode" type="button">Criar cadastro</button></p>
        </div>

        <form id="auth-form" novalidate>
          <label class="field field-name" hidden>
            <span>Nome completo</span>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Seu nome" />
          </label>
          <label class="field">
            <span>E-mail</span>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required />
          </label>
          <label class="field">
            <span>Senha</span>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" minlength="6" required />
          </label>
          <label class="remember-row"><input id="remember" type="checkbox" /> <span>Manter-me conectado</span></label>
          <button class="submit-button" id="submit-button" type="submit">Entrar na conta</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </div>

  <script src="/header.js"></script>
  <script>
    (function () {
      var form = document.getElementById("auth-form");
      var nameField = document.querySelector(".field-name");
      var nameInput = document.getElementById("name");
      var mode = "login";
      var message = document.getElementById("form-message");
      var title = document.getElementById("auth-title");
      var kicker = document.getElementById("form-mode");
      var switchLabel = document.getElementById("switch-label");
      var switchButton = document.getElementById("switch-mode");
      var submitButton = document.getElementById("submit-button");

      switchButton.addEventListener("click", function () {
        mode = mode === "login" ? "signup" : "login";
        var signup = mode === "signup";
        nameField.hidden = !signup;
        nameInput.required = signup;
        title.innerHTML = signup ? "Criar nova conta<span>.</span>" : "Bem-vindo de volta<span>.</span>";
        kicker.textContent = signup ? "COMECE AGORA" : "ACESSAR SUA CONTA";
        switchLabel.textContent = signup ? "Já possui uma conta?" : "Ainda não tem uma conta?";
        switchButton.textContent = signup ? "Entrar" : "Criar cadastro";
        submitButton.textContent = signup ? "Criar minha conta" : "Entrar na conta";
        document.getElementById("password").autocomplete = signup ? "new-password" : "current-password";
        message.textContent = "";
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        message.className = "form-message";
        if (!form.checkValidity()) {
          message.textContent = "Preencha os campos corretamente para continuar.";
          message.classList.add("is-error");
          form.reportValidity();
          return;
        }
        var email = document.getElementById("email").value.trim().toLowerCase();
        var password = document.getElementById("password").value;
        var users = JSON.parse(localStorage.getItem("vc-users") || "{}");
        if (mode === "signup") {
          if (users[email]) {
            message.textContent = "Este e-mail já possui um cadastro.";
            message.classList.add("is-error");
            return;
          }
          users[email] = { name: nameInput.value.trim(), password: password };
          localStorage.setItem("vc-users", JSON.stringify(users));
          switchButton.click();
          message.textContent = "Cadastro criado. Agora você já pode entrar.";
          message.classList.add("is-success");
          return;
        }
        if (!users[email] || users[email].password !== password) {
          message.textContent = "E-mail ou senha inválidos. Crie seu cadastro para começar.";
          message.classList.add("is-error");
          return;
        }
        localStorage.setItem("vc-authenticated", "true");
        message.textContent = "Login realizado com sucesso.";
        message.classList.add("is-success");
      });
    }());
  </script>
</body>
</html>
